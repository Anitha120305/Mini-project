<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Expense Tracker{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>

    <nav class="navbar">
        <span class="brand">Expense Tracker</span>
        <div class="nav-links">
            <a href="{{ url_for('dashboard') }}">Dashboard</a>
            <a href="{{ url_for('add_expense') }}">Add expense</a>
            <a href="{{ url_for('history') }}">History</a>
            <a href="{{ url_for('budget') }}">Budget</a>
            <a href="{{ url_for('reports') }}">Reports</a>
            <a href="{{ url_for('logout') }}">Logout ({{ session['user_name'] }})</a>
        </div>
    </nav>

    <main class="page">

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
                <div class="flash {{ 'flash-warning' if category == 'warning' else '' }}">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        {% block content %}{% endblock %}

    </main>

</body>
</html>
