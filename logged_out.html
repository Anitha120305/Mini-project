<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Logged out - Expense Tracker</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="container">

        <div class="card">

            <h1>Personal Expense Tracker</h1>

            <h2>You have been logged out</h2>

            <p class="subtitle">
                {% if name %}Goodbye, {{ name }}. {% endif %}Your session has ended.
            </p>

            <a href="{{ url_for('login') }}">
                <button type="button">Login again</button>
            </a>

            <p class="bottom-text">
                New here?
                <a href="{{ url_for('register') }}">Create an account</a>
            </p>

        </div>

    </div>

</body>

</html>
